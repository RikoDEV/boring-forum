name: Wiki

# Publishes docs/ to the GitHub wiki. The wiki is a copy: edits made there are overwritten.
# The wiki must be enabled in the repository settings and have at least one page (create any
# page once by hand) before the first run, because GitHub makes its git repository on first save.
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: Clone the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Copy docs and rewrite links
        env:
          BLOB: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}
        run: |
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r docs/. wiki/
          mv wiki/README.md wiki/Home.md
          # Wiki pages have no .md suffix and README is Home. Links that leave docs/ (../) point
          # at the repository instead. docs/plugins/ stays a folder, which the wiki supports.
          find wiki -name '*.md' -exec sed -E -i \
            -e 's#\]\(README\.md(\#[^)]*)?\)#](Home\1)#g' \
            -e "s#\]\((\.\./)+([^)]*)\)#](${BLOB}/\2)#g" \
            -e 's#\]\(([A-Za-z0-9_/-]+)\.md(\#[^)]*)?\)#](\1\2)#g' {} +

      - name: Push
        working-directory: wiki
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Wiki is up to date"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Sync from ${GITHUB_SHA::7}"
          git push
