# Dependency updates with Renovate, self-hosted so it runs in this repository's own Actions.
# Configuration: .github/renovate.json.
#
# Needs a secret RENOVATE_TOKEN: a fine-grained personal access token (or a GitHub App token) for
# this repository with Contents, Pull requests, Issues and Workflows read/write and Metadata
# read. GITHUB_TOKEN cannot be used: pull requests it opens do not start CI, and it cannot edit
# workflow files. Alternatively install the Renovate GitHub App and delete this workflow.

name: Renovate

on:
  schedule:
    - cron: "0 5 * * 1"      # Mondays, 05:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log what would change without opening pull requests
        type: boolean
        default: false

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_DRY_RUN: ${{ inputs.dry_run && 'full' || '' }}
          LOG_LEVEL: info
