# Preview of the next version and its release notes, from the conventional commits since the last
# tag. Run it by hand from the Actions tab. It never tags, commits or publishes: a release is made
# by pushing a vX.Y.Z tag (see docs/releasing.md and release.yml).
#
# Configuration: .releaserc.json.

name: Next version preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24" }
      - uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          semantic_version: 25.0.9
          dry_run: true
          # The preset stays on 9.x: semantic-release 25 bundles conventional-changelog-writer 8, and
          # preset 10 needs writer 9 ("Missing helper" when the release notes are written).
          extra_plugins: |
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
