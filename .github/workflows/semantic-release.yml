# Versioning and release notes from conventional commits. A push to main that contains a
# releasable commit (feat, fix, perf, security, or a breaking change) bumps the workspace
# version, updates CHANGELOG.md, tags vX.Y.Z and creates the GitHub release. The tag then
# starts release.yml, which builds, signs and publishes the image.
#
# Configuration: .releaserc.json. The first release continues from the newest vX.Y.Z tag, so tag
# the current version once (git tag v0.1.0) before the first run.

name: Semantic release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the next version and notes without releasing
        type: boolean
        default: true

concurrency:
  group: semantic-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # the release commit, the tag and the GitHub release
      issues: write           # comments on what a release closes
      pull-requests: write
      actions: write          # starts release.yml for the new tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24" }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: "1.99.1" }
      - id: release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          semantic_version: 25.0.9
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          extra_plugins: |
            conventional-changelog-conventionalcommits@10.4.1
            @semantic-release/changelog@7.0.0
            @semantic-release/exec@7.1.0
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the image for the new tag
        # A tag pushed with GITHUB_TOKEN does not start other workflows, but a dispatch does.
        if: steps.release.outputs.new_release_published == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.new_release_version }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "v$VERSION"
