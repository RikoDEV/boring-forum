name: sqlx

# The checked SQL (query!/query_as!/query_scalar!) is built offline from `.sqlx/`. This job fails
# when the cache no longer matches the queries in the code or the migrations. To regenerate it:
#   DATABASE_URL=postgres://… SQLX_OFFLINE=false cargo sqlx prepare --workspace   (sqlx-cli 0.9)
# and commit `.sqlx/`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: forum, POSTGRES_PASSWORD: forum, POSTGRES_DB: forum }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U forum" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://forum:forum@localhost:5432/forum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: "1.99.1" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version "^0.9" --locked --no-default-features --features postgres,rustls
      - name: Apply the migrations
        run: sqlx migrate run --source crates/bf-db/migrations
      - name: The .sqlx cache matches the queries
        run: cargo sqlx prepare --workspace --check
