# Release images: reproducible build from the lockfiles, CycloneDX SBOMs, a keyless
# Sigstore signature and SLSA build provenance, all attached to the image in the registry.
#
# Verify a release:
#   cosign verify ghcr.io/rikodev/boring-forum@<digest> \
#     --certificate-identity-regexp 'https://github.com/RikoDEV/boring-forum/.github/workflows/release.yml@refs/tags/v.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://ghcr.io/rikodev/boring-forum@<digest> --owner RikoDEV

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/rikodev/boring-forum

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # SBOMs on the GitHub release
      packages: write        # push to ghcr.io
      id-token: write        # keyless signing and provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag is on main and names the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; tag a commit that has been merged"; exit 1
          fi
          cargo_version=$(sed -n '0,/^version = "\(.*\)"/s//\1/p' Cargo.toml)
          if [ "v$cargo_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Cargo.toml says $cargo_version but the tag is $GITHUB_REF_NAME; run scripts/set-version.sh, merge it, and tag again"; exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - id: meta_importer
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}-importer
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The compiled third-party crates are a cached layer (Dockerfile, `cook`), kept in the
          # registry between runs; only the workspace crates compile on a release.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          # BuildKit's own SBOM and provenance attestations, in addition to the ones below.
          sbom: true
          provenance: mode=max
      - name: Build and push the importer image
        # `docker compose --profile import run importer ...` (docs/operations.md). It shares the
        # server's build layers, so this adds little time.
        id: build_importer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: importer
          push: true
          tags: ${{ steps.meta_importer.outputs.tags }}
          labels: ${{ steps.meta_importer.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          sbom: true
          provenance: mode=max
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: "1.99.1" }
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: { tool: cargo-cyclonedx }
      - name: CycloneDX SBOM of the Rust workspace
        # The server crate covers everything that ships; the other crates are its dependencies.
        run: |
          cargo cyclonedx --manifest-path crates/bf-server/Cargo.toml --format json --spec-version 1.5 --override-filename sbom-rust
          cp crates/bf-server/sbom-rust.json sbom-rust.cdx.json
      - name: CycloneDX SBOM of the image
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          upload-release-assets: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image and attach the SBOMs (keyless, Sigstore)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign sign --yes "${{ env.IMAGE }}-importer@${{ steps.build_importer.outputs.digest }}"
          cosign attest --yes --type cyclonedx --predicate sbom-image.cdx.json "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom-rust.cdx.json "$REF"
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Publish the GitHub release with notes from the commit prefixes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # Notes come from the conventional-commit prefixes since the previous tag, not from
          # GitHub's generator, which lists pull requests and so shows nothing for direct pushes.
          bash scripts/release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
            gh release upload "${GITHUB_REF_NAME}" sbom-rust.cdx.json sbom-image.cdx.json --clobber
          else
            gh release create "${GITHUB_REF_NAME}" sbom-rust.cdx.json sbom-image.cdx.json \
              --verify-tag --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          fi
