# Builds the server image from this checkout; layer over compose.yml and add --build.
services:
  server:
    build: { context: .., dockerfile: deploy/docker/Dockerfile }
    pull_policy: never
  db-roles:
    pull_policy: never
  importer:
    build: { context: .., dockerfile: deploy/docker/Dockerfile, target: importer }
    pull_policy: never
