# Runs the server as the least-privilege role `forum_app` instead of the database superuser
#, using deploy/postgres/roles.sql. Layer it over the default file:
#
#   docker compose -f deploy/compose.yml -f deploy/compose.roles.yml up -d --wait
#
# A one-shot `db-roles` service creates the roles (idempotent, so it is safe on an existing
# volume too: it hands over table ownership), then the server migrates as `forum_migrate` and
# serves as `forum_app`. The passwords default to development values; set them in the
# environment for anything that is not your own machine.
services:
  db-roles:
    image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      PGPASSWORD: forum
    volumes:
      - ./postgres/roles.sql:/roles.sql:ro
    entrypoint: ["psql"]
    command:
      - "-h"
      - "db"
      - "-U"
      - "forum"
      - "-d"
      - "forum"
      - "-v"
      - "ON_ERROR_STOP=1"
      - "-v"
      - "app_password='${BF_APP_DB_PASSWORD:-forum_app}'"
      - "-v"
      - "migrate_password='${BF_MIGRATE_DB_PASSWORD:-forum_migrate}'"
      - "-v"
      - "readonly_password='${BF_READONLY_DB_PASSWORD:-forum_readonly}'"
      - "-f"
      - "/roles.sql"
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  server:
    environment:
      BF_DATABASE_URL: postgres://forum_app:${BF_APP_DB_PASSWORD:-forum_app}@db:5432/forum
      BF_MIGRATE_DATABASE_URL: postgres://forum_migrate:${BF_MIGRATE_DB_PASSWORD:-forum_migrate}@db:5432/forum
    depends_on:
      db-roles: { condition: service_completed_successfully }
