# Development: opens Postgres on 127.0.0.1:5432 for a server, psql or tests run on the host.
# Layer over compose.yml: docker compose -f deploy/compose.yml -f deploy/compose.dev.yml up -d --wait db
services:
  db:
    ports: ["127.0.0.1:5432:5432"]
    # The e2e suite runs a server per spec file, in parallel, and each holds several connections:
    # Postgres's default of 100 is not enough ("too many clients already").
    command: ["postgres", "-c", "max_connections=500"]
