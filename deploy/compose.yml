# The published release image and Postgres, for a server. Only the web port is published, on 127.0.0.1
# for a reverse proxy; Postgres is reachable from the stack alone (layer compose.dev.yml to open it).
# Settings: a .env beside this file (see .env.production).
#
# The server never runs as the database owner. `db-roles` creates three least-privilege roles on
# every start (deploy/postgres/roles.sql, built into the server image and safe to repeat):
# forum_migrate owns the schema and runs the migrations, forum_app serves with data access only,
# forum_readonly is for ad-hoc queries. Their
# passwords default to one derived from POSTGRES_PASSWORD, so changing that one value changes all;
# BF_APP_DB_PASSWORD, BF_MIGRATE_DB_PASSWORD and BF_READONLY_DB_PASSWORD set them separately.
services:
  db:
    image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forum}
      POSTGRES_DB: ${POSTGRES_DB:-forum}
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      # The user and database come from the container's own environment, so changing them above
      # (or in .env) cannot leave the check asking for a role that does not exist.
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      retries: 30

  db-roles:
    # The server image applies the roles itself (`boring-forum provision-roles`): no extra file, no psql.
    image: ghcr.io/rikodev/boring-forum:${BF_VERSION:-latest}
    command: ["provision-roles"]
    environment:
      BF_ADMIN_DATABASE_URL: postgres://${POSTGRES_USER:-forum}:${POSTGRES_PASSWORD:-forum}@db:5432/${POSTGRES_DB:-forum}
      BF_APP_DB_PASSWORD: ${BF_APP_DB_PASSWORD:-${POSTGRES_PASSWORD:-forum}_app}
      BF_MIGRATE_DB_PASSWORD: ${BF_MIGRATE_DB_PASSWORD:-${POSTGRES_PASSWORD:-forum}_migrate}
      BF_READONLY_DB_PASSWORD: ${BF_READONLY_DB_PASSWORD:-${POSTGRES_PASSWORD:-forum}_readonly}
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  server:
    image: ghcr.io/rikodev/boring-forum:${BF_VERSION:-latest}
    env_file:
      - path: .env
        required: false
    environment:
      BF_DATABASE_URL: postgres://forum_app:${BF_APP_DB_PASSWORD:-${POSTGRES_PASSWORD:-forum}_app}@db:5432/${POSTGRES_DB:-forum}
      BF_MIGRATE_DATABASE_URL: postgres://forum_migrate:${BF_MIGRATE_DB_PASSWORD:-${POSTGRES_PASSWORD:-forum}_migrate}@db:5432/${POSTGRES_DB:-forum}
    ports:
      - 8080
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - uploads:/data/uploads
      - backups:/data/backups
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/boring-forum", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      db: { condition: service_healthy }
      db-roles: { condition: service_completed_successfully }

volumes:
  pgdata:
  uploads:
  backups:
