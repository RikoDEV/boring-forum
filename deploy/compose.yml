# The published release image and Postgres. Settings: a .env beside this file (see .env.example).
services:
  db:
    image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_USER: forum
      POSTGRES_PASSWORD: forum
      POSTGRES_DB: forum
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forum"]
      interval: 2s
      retries: 30

  server:
    image: ghcr.io/rikodev/boring-forum:${BF_VERSION:-latest}
    env_file:
      - path: .env
        required: false
    environment:
      BF_DATABASE_URL: postgres://forum:forum@db:5432/forum
      BF_BIND: 0.0.0.0:8080
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - uploads:/data/uploads
      - backups:/data/backups
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/boring-forum", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
  backups:
