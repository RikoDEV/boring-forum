[package]
name = "community-kit"
version = "1.0.0"
edition = "2024"
publish = false

# Not part of the forum's workspace: it builds for wasm32 with its own lockfile and profile.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
bf-plugin-api = { path = "../../../../crates/bf-plugin-api" }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
