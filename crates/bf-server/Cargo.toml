[package]
name = "bf-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "boring-forum"
path = "src/main.rs"

[dependencies]
aes-gcm.workspace = true
# Optional TLS termination for deployments without a reverse proxy. rustls offers
# TLS 1.2 and 1.3 only, so the library's floor is the minimum version.
axum-server = { version = "0.9", default-features = false, features = ["tls-rustls"] }
hkdf = "0.13"
p256 = { workspace = true, features = ["ecdh", "ecdsa"] }
bf-core = { path = "../bf-core" }
bf-db = { path = "../bf-db" }
bf-web = { path = "../bf-web" }
bf-cook = { path = "../bf-cook" }
bf-seo = { path = "../bf-seo" }
bf-realtime = { path = "../bf-realtime" }
chrono.workspace = true
futures-util.workspace = true
# Incoming mail comes in any character set (Polish clients still send windows-1250).
encoding_rs = "0.8"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
axum.workspace = true
dashmap.workspace = true
moka = { workspace = true, features = ["sync"] }
mimalloc.workspace = true
imagesize.workspace = true
base64.workspace = true
# Email-in over IMAP (`BF_IMAP_HOST`): the TLS stack the other clients already build.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"
url = "2"
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "wat", "std"] }
toml = "1"
# Backups are .tar.gz archives.
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "avif"] }
rand.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form", "multipart", "webpki-roots"] }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
ed25519-dalek = "3.0.0"
hmac.workspace = true
sha1.workspace = true
# Observability: Prometheus metrics and optional OTLP trace export.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-client", "trace"] }
tracing-opentelemetry = "0.34"
# ActivityPub: Mastodon-compatible HTTP signatures are RSA-SHA256.
rsa = { version = "0.10", features = ["pkcs1v15"] }
resvg = { version = "0.50.0", default-features = false, features = ["text", "raster-images"] }

[lints]
workspace = true
