[package]
name = "bf-plugin-api"
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SDK for boring-forum WebAssembly plugins: typed host calls, hook payloads and the entry-point glue."
publish = false

# No [lints] table on purpose: the glue macro exports `alloc` and `handle` with `#[unsafe(no_mangle)]`,
# which the workspace's `unsafe_code = "forbid"` would refuse. A plugin crate is separate code.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
